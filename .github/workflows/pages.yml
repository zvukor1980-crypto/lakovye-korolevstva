name: Pages

# Включается вручную: у токена интеграции нет права создать сайт Pages (API отвечает 403).
# Когда в настройках репозитория выбран источник «GitHub Actions», запустите этот процесс.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать сайт
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude _site --exclude .github . _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
