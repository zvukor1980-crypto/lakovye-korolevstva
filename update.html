<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Обновление Лаковых королевств</title><style>body{margin:0;background:#11252c;color:#f1e4c3;font:18px system-ui;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));line-height:1.6}main{max-width:520px;margin:auto}button,a{display:block;padding:16px;border-radius:12px;margin:18px 0;background:#d9ba77;color:#172a30;font:700 18px system-ui;border:0;text-align:center}small{color:#bbc8c6}</style><main><h1>Лаковые королевства</h1><h2>Восстановить обновление</h2><p>Загрузим свежие файлы игры. Сохранённые партии и настройки останутся на месте.</p><noscript>Включите JavaScript в Safari, чтобы обновить игру.</noscript><button type="button" id="repair">Обновить файлы игры</button><p id="status" role="status"></p><a href="./index.html?release=2.1.2">Открыть игру напрямую</a><small>После обновления откройте прежний значок игры. В главном меню должен появиться номер 2.1.2.</small></main><script>
function limit(p){let t;return Promise.race([p,new Promise((_,reject)=>{t=setTimeout(()=>reject(Error('Операция не ответила за 12 секунд')),12000);})]).finally(()=>clearTimeout(t));}
document.getElementById('repair').onclick=async()=>{
const b=document.getElementById('repair'),s=document.getElementById('status');b.disabled=true;s.textContent='Шаг 1 из 3: проверяем соединение…';
try{
const base=new URL('./',location.href),r=await limit(fetch(new URL('version.json?t='+Date.now(),base),{cache:'no-store'}));if(!r.ok)throw Error('Нет соединения');const v=await limit(r.json());
if('serviceWorker'in navigator){s.textContent='Шаг 2 из 3: отключаем старую загрузку…';const regs=await limit(navigator.serviceWorker.getRegistrations());for(const reg of regs)if(reg.scope===base.href)await limit(reg.unregister());}
if('caches'in window){s.textContent='Шаг 3 из 3: обновляем кэш файлов…';for(const name of await limit(caches.keys()))if(/^lk-\d/.test(name))await limit(caches.delete(name));}
s.textContent='Открываем версию '+v.version+'…';location.replace(new URL('index.html?updated='+encodeURIComponent(v.version)+'&t='+Date.now(),base).href);
}catch(e){s.textContent='Обновление не завершено: '+e.message+'. Попробуйте открыть эту страницу именно в Safari, затем повторите.';b.disabled=false;}
};</script></html>
